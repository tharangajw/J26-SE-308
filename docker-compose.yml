services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: pscore-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pscore-net

  jaeger:
    image: jaegertracing/all-in-one:1.46
    container_name: pscore-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - pscore-net

  anomaly-detection:
    build:
      context: ./performance/anomaly-detection
      dockerfile: Dockerfile
    container_name: pscore-anomaly-detection
    ports:
      - "8000:8000"
    networks:
      - pscore-net

  telemetry-collector:
    build:
      context: ./telemetry-collector
      dockerfile: Dockerfile
    container_name: pscore-telemetry-collector
    ports:
      - "8787:8787"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      JAEGER_URL: http://jaeger:16686
      KUBERNETES_URL: http://host.docker.internal:8001
    depends_on:
      - prometheus
      - jaeger
    networks:
      - pscore-net

networks:
  pscore-net:
    driver: bridge
