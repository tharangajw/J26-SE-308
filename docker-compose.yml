services:
  telemetry-collector:
    build:
      context: ./telemetry-collector
      dockerfile: Dockerfile
    container_name: pscore-telemetry-collector
    ports:
      - "8787:8787"
    environment:
      PROMETHEUS_URL: http://host.docker.internal:9090
      JAEGER_URL: http://host.docker.internal:16686
      KUBERNETES_URL: http://host.docker.internal:8001
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
