services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pscore-frontend
    ports:
      - "5173:5173"
    environment:
      PROMETHEUS_PROXY_TARGET: http://prometheus:9090
      LOKI_PROXY_TARGET: http://loki:3100
      JAEGER_PROXY_TARGET: http://jaeger:16686
    depends_on:
      - resilience-api
      - performance-engine
    networks:
      - pscore-net

  resilience-api:
    build:
      context: ./backend/resiliance
      dockerfile: Dockerfile
    container_name: pscore-resilience-api
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      PROMETHEUS_URL: http://prometheus:9090
      KUBERNETES_URL: http://host.docker.internal:8001
      FRONTEND_HEALTH_URL: http://frontend:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - resilience-data:/app/data
    networks:
      - pscore-net

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: pscore-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./backend/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pscore-net

  jaeger:
    image: jaegertracing/all-in-one:1.46
    container_name: pscore-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - pscore-net

  loki:
    image: grafana/loki:2.9.8
    container_name: pscore-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - pscore-net

  observability-engine:
    build:
      context: ./backend/observability-engine
      dockerfile: Dockerfile
    container_name: pscore-observability-engine
    ports:
      - "8010:8010"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      JAEGER_URL: http://jaeger:16686
      OBSERVABILITY_TIMEOUT_SECONDS: 2
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${VITE_GEMINI_API_KEY:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.8-flash}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-sonnet-latest}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - pscore-net

  performance-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile.performance
    image: pscore-performance-engine:latest
    container_name: pscore-performance-engine
    ports:
      - "8000:8000"
      - "8787:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8787
      COLLECTOR_URL: http://127.0.0.1:8787
      PROMETHEUS_URL: http://prometheus:9090
      JAEGER_URL: http://jaeger:16686
      LOKI_URL: http://loki:3100
      KUBERNETES_URL: http://host.docker.internal:8001
    networks:
      pscore-net:
        aliases:
          - telemetry-collector
          - anomaly-detection
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  mongodb:
    image: mongo:7
    container_name: pscore-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - pscore-net

networks:
  pscore-net:
    driver: bridge

volumes:
  resilience-data:
  mongo-data:
