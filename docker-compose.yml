version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: pscore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./k8s/prometheus-jaeger-manifests.yaml:/etc/prometheus/prometheus.yml
    networks:
      - pscore-net

  jaeger:
    image: jaegertracing/all-in-one:1.46
    container_name: pscore-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - pscore-net

  anomaly-detection:
    build:
      context: ./anomaly-detection
      dockerfile: Dockerfile
    container_name: pscore-anomaly-detection
    ports:
      - "8000:8000"
    networks:
      - pscore-net

networks:
  pscore-net:
    driver: bridge
