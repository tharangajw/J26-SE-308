services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pscore-frontend
    ports:
      - "5173:3000"
    environment:
      PROMETHEUS_PROXY_TARGET: http://prometheus:9090
      LOKI_PROXY_TARGET: http://loki:3100
      JAEGER_PROXY_TARGET: http://jaeger:16686
      OBSERVABILITY_PROXY_TARGET: http://observability-engine:8010
      ANOMALY_PROXY_TARGET: http://anomaly-detection:8000
    depends_on:
      - resilience-api
      - telemetry-collector
      - observability-engine
    networks:
      - pscore-net

  # R-Score API for resilience telemetry, chaos experiments, and Gemini insights.
  resilience-api:
    build:
      context: ./backend/resiliance
      dockerfile: Dockerfile
    container_name: pscore-resilience-api
    ports:
      # Expose the API at http://localhost:3010.
      - "3010:3010"
    environment:
      PORT: 3010
      PROMETHEUS_URL: http://prometheus:9090
      # Requires kubectl proxy on the host at port 8001 to reach Kubernetes.
      KUBERNETES_URL: http://host.docker.internal:8001
      FRONTEND_HEALTH_URL: http://frontend:3000
      # Compose reads these variables from the project-root .env file.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    extra_hosts:
      # Resolve host.docker.internal from this container.
      - "host.docker.internal:host-gateway"
    volumes:
      # Keep resilience history when the container is recreated.
      - resilience-data:/app/data
    networks:
      - pscore-net

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: pscore-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./backend/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pscore-net

  jaeger:
    image: jaegertracing/all-in-one:1.46
    container_name: pscore-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - pscore-net

  loki:
    image: grafana/loki:2.9.8
    container_name: pscore-loki
    ports:
      - "13100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./backend/observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    networks:
      - pscore-net

  observability-engine:
    build:
      context: ./backend/observability-engine
      dockerfile: Dockerfile
    container_name: pscore-observability-engine
    ports:
      - "18011:8010"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      JAEGER_URL: http://jaeger:16686
      OBSERVABILITY_TIMEOUT_SECONDS: 2
      TELEMETRY_COLLECTOR_URL: http://telemetry-collector:8787
      # Support the existing frontend-style variable while keeping the key server-side.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${VITE_GEMINI_API_KEY:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.8-flash}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-sonnet-latest}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
    depends_on:
      - prometheus
      - loki
      - jaeger
      - telemetry-collector
    networks:
      - pscore-net

  anomaly-detection:
    build:
      context: ./backend/performance/anomaly-detection
      dockerfile: Dockerfile
    container_name: pscore-anomaly-detection
    ports:
      - "18002:8000"
    networks:
      - pscore-net

  telemetry-collector:
    build:
      context: ./backend/telemetry-collector
      dockerfile: Dockerfile
    container_name: pscore-telemetry-collector
    ports:
      - "8787:8787"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      JAEGER_URL: http://jaeger:16686
      KUBERNETES_URL: http://host.docker.internal:8001
    networks:
      - pscore-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  pscore-net:
    driver: bridge

volumes:
  resilience-data:
