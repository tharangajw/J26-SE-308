services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: pscore-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./backend/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pscore-net

  jaeger:
    image: jaegertracing/all-in-one:1.46
    container_name: pscore-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - pscore-net

  loki:
    image: grafana/loki:2.9.8
    container_name: pscore-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - pscore-net

  observability-engine:
    build:
      context: ./backend/observability-engine
      dockerfile: Dockerfile
    container_name: pscore-observability-engine
    ports:
      - "8010:8010"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      JAEGER_URL: http://jaeger:16686
      OBSERVABILITY_TIMEOUT_SECONDS: 2
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.8-flash}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-sonnet-latest}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - pscore-net

  anomaly-detection:
    build:
      context: ./backend/performance/anomaly-detection
      dockerfile: Dockerfile
    container_name: pscore-anomaly-detection
    ports:
      - "8000:8000"
    networks:
      - pscore-net

  telemetry-collector:
    build:
      context: ./backend/telemetry-collector
      dockerfile: Dockerfile
    container_name: pscore-telemetry-collector
    ports:
      - "8787:8787"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      JAEGER_URL: http://jaeger:16686
      KUBERNETES_URL: http://host.docker.internal:8001
    networks:
      - pscore-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  pscore-net:
    driver: bridge
