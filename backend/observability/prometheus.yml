global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  # Add application targets here when services expose /metrics.
  # Kubernetes uses the equivalent scrape annotations in k8s/performance-stack.yaml.
  - job_name: telemetry-collector
    static_configs:
      - targets: ['telemetry-collector:8787']