services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: pscore-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pscore-net

  jaeger:
    image: jaegertracing/all-in-one:1.46
    container_name: pscore-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - pscore-net

  anomaly-detection:
    build:
      context: ./performance/anomaly-detection
      dockerfile: Dockerfile
    container_name: pscore-anomaly-detection
    ports:
      - "8000:8000"
    networks:
      - pscore-net

  telemetry-collector:
    build:
      context: ./telemetry-collector
      dockerfile: Dockerfile
    container_name: pscore-telemetry-collector
    ports:
      - "8787:8787"
    volumes:
      - ./telemetry-collector/dist:/app/dist
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROMETHEUS_URL: http://host.docker.internal:9091
      JAEGER_URL: http://host.docker.internal:16686
      KUBERNETES_URL: http://host.docker.internal:8001
      LOKI_URL: http://host.docker.internal:3100
    networks:
      - pscore-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  pscore-net:
    driver: bridge
