services:
  performance-engine:
    build:
      context: .
      dockerfile: Dockerfile.performance
    image: pscore-performance-engine:latest
    container_name: pscore-performance-engine
    ports:
      - "8000:8000"
      - "8787:8787"
    volumes:
      - ./performance/anomaly-detection:/app/anomaly-detection
      - ./telemetry-collector/dist:/app/telemetry-collector/dist
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8787
      COLLECTOR_URL: http://127.0.0.1:8787
      PROMETHEUS_URL: http://prometheus:9090
      JAEGER_URL: http://jaeger:16686
      LOKI_URL: http://loki:3100
      KUBERNETES_URL: http://host.docker.internal:8001
    networks:
      pscore-net:
        aliases:
          - telemetry-collector
          - anomaly-detection
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # Optional external observability stack (only starts when running: docker compose --profile observability up -d)
  prometheus:
    image: prom/prometheus:latest
    container_name: pscore-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pscore-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pscore-jaeger
    profiles: ["observability"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - pscore-net

  loki:
    image: grafana/loki:latest
    container_name: pscore-loki
    profiles: ["observability"]
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - pscore-net

  mongodb:
    image: mongo:7
    container_name: pscore-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - pscore-net

networks:
  pscore-net:
    driver: bridge

volumes:
  mongo-data:
